version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: factoryos_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - postgres
      - redis
    networks:
      - factoryos

  nginx:
    image: nginx:alpine
    container_name: factoryos_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/dev/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - factoryos

  postgres:
    image: postgres:16-alpine
    container_name: factoryos_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: factoryos
      POSTGRES_USER: factoryos
      POSTGRES_PASSWORD: factoryos
    volumes:
      - factoryos_postgres_data:/var/lib/postgresql/data
    networks:
      - factoryos

  redis:
    image: redis:7-alpine
    container_name: factoryos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - factoryos_redis_data:/data
    networks:
      - factoryos

  worker:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: factoryos_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work
    depends_on:
      - postgres
      - redis
    networks:
      - factoryos

volumes:
  factoryos_postgres_data:
  factoryos_redis_data:

networks:
  factoryos:
    driver: bridge