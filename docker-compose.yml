name: factory

x-laravel: &laravel
  image: factory_app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment:
    APP_NAME: "Brixel FactoryOS"
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-factory}
    DB_USERNAME: ${DB_USERNAME:-factory}
    DB_PASSWORD: ${DB_PASSWORD:-factory_secret}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - factory_network

services:
  app:
    <<: *laravel
    container_name: factory_app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: factory_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - factory_network

  postgres:
    image: postgres:16-alpine
    container_name: factory_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-factory}
      POSTGRES_USER: ${DB_USERNAME:-factory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-factory_secret}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - factory_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-factory} -d ${DB_DATABASE:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - factory_network

  redis:
    image: redis:alpine
    container_name: factory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - factory_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - factory_network

  node:
    image: node:current-alpine
    container_name: factory_node
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    environment:
      VITE_HMR_PORT: 5173
      APP_URL: http://localhost:8000
    volumes:
      - .:/var/www/html
      - factory_node_modules:/var/www/html/node_modules
    command: [sh, -c, "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    networks:
      - factory_network

  queue:
    <<: *laravel
    container_name: factory_queue
    restart: unless-stopped
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=60]

  scheduler:
    <<: *laravel
    container_name: factory_scheduler
    restart: unless-stopped
    command: [php, artisan, schedule:work]

volumes:
  factory_postgres_data:
  factory_redis_data:
  factory_node_modules:

networks:
  factory_network:
    driver: bridge