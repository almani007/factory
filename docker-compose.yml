name: factory

# ============================================================================
# Brixel FactoryOS - Docker Compose
# ============================================================================
# Just run: docker compose up -d
# Everything is auto-configured (migrations, key generation, storage link)
# ============================================================================

x-laravel: &laravel
  image: factory_app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html:delegated
    - factory_vendor:/var/www/html/vendor
    - factory_build:/var/www/html/public/build
  environment:
    APP_NAME: "Brixel FactoryOS"
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8087
    APP_TIMEZONE: Asia/Karachi
    APP_LOCALE: en
    TELESCOPE_ENABLED: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-factory}
    DB_USERNAME: ${DB_USERNAME:-factory}
    DB_PASSWORD: ${DB_PASSWORD:-factory_secret}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_MAILER: log
    AWS_ACCESS_KEY_ID:
    AWS_SECRET_ACCESS_KEY:
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET:
    SANACTUM_STATEFUL_DOMAINS: localhost:8000
    SESSION_DOMAIN: localhost
    LICENSE_MODE: local
    LICENSE_FILE: storage/licence/licence.dat
    LICENSE_VALIDATION_INTERVAL_HOURS: 24
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - factory_network

services:
  # =========================================================================
  # App (PHP 8.5 + Laravel)
  # =========================================================================
  app:
    <<: *laravel
    container_name: factory_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "php", "-r", "new PDO('pgsql:host=postgres;port=5432;dbname=factory', 'factory', 'factory_secret');"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # Nginx Web Server
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: factory_nginx
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - .:/var/www/html:ro
      - factory_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - factory_network

  # =========================================================================
  # PostgreSQL 18 Database (internal only - accessible via postgres:5432)
  # =========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: factory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-factory}
      POSTGRES_USER: ${DB_USERNAME:-factory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-factory_secret}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - factory_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-factory} -d ${DB_DATABASE:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - factory_network

  # =========================================================================
  # Redis 8 (Cache, Queue, Sessions) - internal only
  # =========================================================================
  redis:
    image: redis:8-alpine
    container_name: factory_redis
    restart: unless-stopped
    volumes:
      - factory_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - factory_network

  # =========================================================================
  # Node.js (Vite Dev Server for Hot Module Replacement)
  # =========================================================================
  node:
    image: node:22-alpine
    container_name: factory_node
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    environment:
      VITE_HMR_PORT: 5173
      APP_URL: http://localhost:8000
    volumes:
      - .:/var/www/html:delegated
      - factory_node_modules:/var/www/html/node_modules
    command: [sh, -c, "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    networks:
      - factory_network

  # =========================================================================
  # Queue Worker
  # =========================================================================
  queue:
    <<: *laravel
    container_name: factory_queue
    restart: unless-stopped
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=60]
    depends_on:
      - app
      - redis
    networks:
      - factory_network

  # =========================================================================
  # Scheduler
  # =========================================================================
  scheduler:
    <<: *laravel
    container_name: factory_scheduler
    restart: unless-stopped
    command: [php, artisan, schedule:work]
    depends_on:
      - app
    networks:
      - factory_network

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  factory_postgres_data:
  factory_redis_data:
  factory_node_modules:
  factory_vendor:
  factory_build:

# ===========================================================================
# Networks
# ===========================================================================
networks:
  factory_network:
    driver: bridge